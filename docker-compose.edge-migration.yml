# Production migration overlay only.
#
# This keeps the legacy ProjectFlow proxy network for rollback while adding the
# dedicated Edge Gateway network. After the observation window, apply the
# permanent base-Compose change documented in contrib/EDGE_GATEWAY_PRODUCTION.md
# and stop using this overlay.
services:
  frontend:
    networks:
      mailflow:
      projectflow_proxy:
      edge_mailflow:
        aliases:
          - mailflow-ingress

networks:
  projectflow_proxy:
    name: deploy_projectflow_internal
    external: true
  edge_mailflow:
    name: edge_mailflow
    external: true
