name: Publish Native Apps

on:
  push:
    tags:
      - "v*-custom.*"
  workflow_dispatch:
    inputs:
      version:
        description: Custom release tag (vX.Y.Z-custom.N)
        required: true
        type: string
      publish:
        description: Publish an existing immutable tag after verification
        required: true
        type: boolean
        default: false

concurrency:
  group: native-apps-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      version-name: ${{ steps.release.outputs.version-name }}
      version-code: ${{ steps.release.outputs.version-code }}
      publish: ${{ steps.release.outputs.publish }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || (inputs.publish && inputs.version || github.sha) }}

      - name: Resolve and validate release version
        id: release
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            APP_VERSION="${GITHUB_REF_NAME}"
            PUBLISH=true
          else
            APP_VERSION="${DISPATCH_VERSION}"
            PUBLISH="${DISPATCH_PUBLISH:-false}"
          fi

          RELEASE_JSON="$(APP_VERSION="$APP_VERSION" node <<'NODE'
          const { parseCustomVersion } = require('./frontend/packages/shared/custom-release.cjs');
          const parsed = parseCustomVersion(process.env.APP_VERSION);
          if (!parsed) {
            console.error('Version must match vX.Y.Z-custom.N and fit Android versionCode limits.');
            process.exit(1);
          }
          process.stdout.write(JSON.stringify(parsed));
          NODE
          )"

          git fetch origin "+refs/heads/custom/release:refs/remotes/origin/custom/release" --tags
          if [[ "$PUBLISH" == "true" ]]; then
            git merge-base --is-ancestor HEAD origin/custom/release || {
              echo "Release commit is not part of origin/custom/release." >&2
              exit 1
            }
            git show-ref --verify --quiet "refs/tags/$APP_VERSION" || {
              echo "Formal publication requires an existing immutable tag: $APP_VERSION" >&2
              exit 1
            }
            [[ "$(git rev-parse "refs/tags/$APP_VERSION^{commit}")" == "$(git rev-parse HEAD)" ]] || {
              echo "Checked-out commit does not match $APP_VERSION." >&2
              exit 1
            }
          else
            git merge-base --is-ancestor origin/custom/release HEAD || {
              echo "Dry-run source must be based on origin/custom/release." >&2
              exit 1
            }
          fi

          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "version-name=$(jq -r .versionName <<<"$RELEASE_JSON")" >> "$GITHUB_OUTPUT"
          echo "version-code=$(jq -r .versionCode <<<"$RELEASE_JSON")" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Test and lint backend
        working-directory: backend
        run: |
          npm ci
          npm test
          npm run lint

      - name: Test, lint, and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

  windows:
    name: Windows x64 unsigned NSIS
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build unsigned Windows package
        working-directory: frontend
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run app:version -- $env:APP_VERSION
          npm run electron:dist -- --win nsis --x64

      - name: Verify Windows package
        working-directory: frontend
        shell: pwsh
        env:
          VERSION_NAME: ${{ needs.validate.outputs.version-name }}
        run: |
          $release = Resolve-Path 'packages/release'
          $exe = Get-Item -LiteralPath (Join-Path $release "MailFlow-$env:VERSION_NAME-Setup.exe")
          Get-Item -LiteralPath "$($exe.FullName).blockmap" | Out-Null
          Get-Item -LiteralPath (Join-Path $release 'latest.yml') | Out-Null
          $asar = Join-Path $release 'win-unpacked/resources/app.asar'
          Get-Item -LiteralPath $asar | Out-Null
          node -e "const path = require('path'); require('@electron/asar').extractFile(process.argv[1], path.win32.join('packages', 'shared', 'custom-release.cjs'))" $asar
          if ($LASTEXITCODE -ne 0) {
            throw 'Packaged Electron app is missing packages/shared/custom-release.cjs.'
          }
          $updateConfig = Get-Content -Raw -LiteralPath (Join-Path $release 'win-unpacked/resources/app-update.yml')
          if ($updateConfig -match '(?m)^publisherName:') {
            throw 'Unsigned Windows update configuration must not contain publisherName.'
          }

          if ($exe.VersionInfo.ProductVersion -ne $env:VERSION_NAME) {
            throw "Unexpected ProductVersion: $($exe.VersionInfo.ProductVersion)"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          if ($signature.Status -ne 'NotSigned' -or $signature.SignerCertificate) {
            throw "Windows package must remain unsigned: $($signature.Status)"
          }

          [ordered]@{
            productVersion = $exe.VersionInfo.ProductVersion
            size = $exe.Length
            sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName).Hash.ToLowerInvariant()
            signaturePolicy = 'unsigned'
            authenticodeStatus = $signature.Status.ToString()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $release 'windows-verification.json') -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: mailflow-windows-${{ needs.validate.outputs.version-name }}
          if-no-files-found: error
          path: |
            frontend/packages/release/MailFlow-${{ needs.validate.outputs.version-name }}-Setup.exe
            frontend/packages/release/MailFlow-${{ needs.validate.outputs.version-name }}-Setup.exe.blockmap
            frontend/packages/release/latest.yml
            frontend/packages/release/windows-verification.json

  android:
    name: Android signed APK and AAB
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Prepare Android release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MAILFLOW_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MAILFLOW_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAILFLOW_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MAILFLOW_ANDROID_KEY_PASSWORD }}
          EXPECTED_CERTIFICATE: ${{ vars.MAILFLOW_ANDROID_CERTIFICATE_SHA256 }}
        run: |
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(MAILFLOW_ANDROID_KEYSTORE_BASE64)
          [[ -n "$STORE_PASSWORD" ]] || missing+=(MAILFLOW_ANDROID_STORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(MAILFLOW_ANDROID_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(MAILFLOW_ANDROID_KEY_PASSWORD)
          [[ -n "$EXPECTED_CERTIFICATE" ]] || missing+=("MAILFLOW_ANDROID_CERTIFICATE_SHA256 (variable)")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Android signing configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/mailflow-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mailflow-signing/release.keystore"
          chmod 600 "$RUNNER_TEMP/mailflow-signing/release.keystore"
          echo "MAILFLOW_ANDROID_STORE_FILE=$RUNNER_TEMP/mailflow-signing/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed Android packages
        working-directory: frontend
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
          MAILFLOW_ANDROID_STORE_PASSWORD: ${{ secrets.MAILFLOW_ANDROID_STORE_PASSWORD }}
          MAILFLOW_ANDROID_KEY_ALIAS: ${{ secrets.MAILFLOW_ANDROID_KEY_ALIAS }}
          MAILFLOW_ANDROID_KEY_PASSWORD: ${{ secrets.MAILFLOW_ANDROID_KEY_PASSWORD }}
          MAILFLOW_ANDROID_CERTIFICATE_SHA256: ${{ vars.MAILFLOW_ANDROID_CERTIFICATE_SHA256 }}
        run: |
          npm ci
          npm run app:version -- "$APP_VERSION"
          npm run android:sync
          pushd packages/android
          bash ./gradlew test lint assembleRelease bundleRelease
          popd
          node packages/scripts/collect-android-artifacts.cjs

      - name: Verify Android packages
        working-directory: frontend
        shell: bash
        env:
          VERSION_NAME: ${{ needs.validate.outputs.version-name }}
          VERSION_CODE: ${{ needs.validate.outputs.version-code }}
          EXPECTED_CERTIFICATE: ${{ vars.MAILFLOW_ANDROID_CERTIFICATE_SHA256 }}
        run: |
          APK="packages/release/MailFlow-$VERSION_NAME.apk"
          AAB="packages/release/MailFlow-$VERSION_NAME.aab"
          test -s "$APK"
          test -s "$AAB"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          [[ "$BADGING" == *"name='sh.mailflow.app'"* ]]
          [[ "$BADGING" == *"versionCode='$VERSION_CODE'"* ]]
          [[ "$BADGING" == *"versionName='$VERSION_NAME'"* ]]

          CERT_OUTPUT="$($APKSIGNER verify --verbose --print-certs "$APK")"
          CERTIFICATE_LINE="$(grep -im1 'certificate SHA-256 digest:' <<<"$CERT_OUTPUT" || true)"
          ACTUAL_CERTIFICATE="$(sed 's/^.*: //' <<<"$CERTIFICATE_LINE" | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_NORMALIZED="$(tr -cd '[:xdigit:]' <<<"$EXPECTED_CERTIFICATE" | tr '[:lower:]' '[:upper:]')"

          [[ ${#EXPECTED_NORMALIZED} -eq 64 ]] || {
            echo 'Configured Android certificate SHA-256 is not a 64-character hexadecimal digest.' >&2
            exit 1
          }
          [[ ${#ACTUAL_CERTIFICATE} -eq 64 ]] || {
            echo 'Unable to parse the Android signing certificate SHA-256 from apksigner output.' >&2
            printf '%s\n' "$CERT_OUTPUT" >&2
            exit 1
          }
          [[ "$ACTUAL_CERTIFICATE" == "$EXPECTED_NORMALIZED" ]] || {
            printf 'Android signing certificate SHA-256 mismatch. Expected %s, got %s.\n' "$EXPECTED_NORMALIZED" "$ACTUAL_CERTIFICATE" >&2
            exit 1
          }

          jq -n \
            --arg packageName sh.mailflow.app \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg certificateSha256 "$ACTUAL_CERTIFICATE" \
            --arg sha256 "$(sha256sum "$APK" | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s "$APK")" \
            '{packageName:$packageName,versionName:$versionName,versionCode:$versionCode,certificateSha256:$certificateSha256,sha256:$sha256,size:$size}' \
            > packages/release/android-verification.json

      - uses: actions/upload-artifact@v4
        with:
          name: mailflow-android-${{ needs.validate.outputs.version-name }}
          if-no-files-found: error
          path: |
            frontend/packages/release/MailFlow-${{ needs.validate.outputs.version-name }}.apk
            frontend/packages/release/MailFlow-${{ needs.validate.outputs.version-name }}.aab
            frontend/packages/release/android-verification.json

  aggregate:
    name: Generate manifest and checksums
    needs: [validate, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          path: source

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release metadata from verified artifacts
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
          ANDROID_CERTIFICATE_SHA256: ${{ vars.MAILFLOW_ANDROID_CERTIFICATE_SHA256 }}
        run: |
          node source/frontend/packages/scripts/generate-update-metadata.cjs \
            --artifacts artifacts \
            --output release-assets \
            --tag "$APP_VERSION" \
            --android-certificate-sha256 "$ANDROID_CERTIFICATE_SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: mailflow-native-release-${{ needs.validate.outputs.version-name }}
          if-no-files-found: error
          path: release-assets/

  release:
    name: Publish verified GitHub Release
    needs: [validate, aggregate]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      APP_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: actions/download-artifact@v4
        with:
          name: mailflow-native-release-${{ needs.validate.outputs.version-name }}
          path: release-assets

      - name: Create or verify Draft Release
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          jq --arg tag "$APP_VERSION" '[.[] | select(.tag_name == $tag)]' releases.json > matching-releases.json

          [[ "$(jq 'length' matching-releases.json)" -le 1 ]] || {
            echo "Multiple Releases found for $APP_VERSION." >&2
            exit 1
          }

          if [[ "$(jq 'length' matching-releases.json)" -eq 1 ]]; then
            jq '.[0]' matching-releases.json > release.json
            [[ "$(jq -r .draft release.json)" == "true" ]] || {
              echo 'Refusing to replace an already published Release.' >&2
              exit 1
            }
            exit 0
          fi

          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$APP_VERSION" > /dev/null
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$APP_VERSION" \
            -f name="MailFlow ${APP_VERSION#v}" \
            -f body="Unsigned Windows x64 package and signed Android packages for $APP_VERSION." \
            -F draft=true \
            -F prerelease=false \
            > release.json

      - name: Upload and verify all Release assets
        shell: bash
        run: |
          release_id="$(jq -r .id release.json)"
          [[ "$release_id" =~ ^[0-9]+$ ]] || {
            echo 'Draft Release ID is missing or invalid.' >&2
            exit 1
          }

          gh api "repos/${GITHUB_REPOSITORY}/releases/$release_id/assets?per_page=100" > existing-assets.json
          for asset in release-assets/*; do
            asset_name="$(basename "$asset")"
            existing_asset_id="$(
              jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' existing-assets.json |
                head -n 1
            )"
            if [[ -n "$existing_asset_id" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$existing_asset_id"
            fi

            encoded_name="$(jq -rn --arg value "$asset_name" '$value | @uri')"
            gh api --method POST \
              -H 'Content-Type: application/octet-stream' \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=$encoded_name" \
              --input "$asset" \
              > /dev/null
          done

          gh api "repos/${GITHUB_REPOSITORY}/releases/$release_id" > release.json
          node frontend/packages/scripts/verify-release-assets.cjs release-assets release.json

      - name: Publish stable Release
        shell: bash
        run: |
          release_id="$(jq -r .id release.json)"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$release_id" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true \
            > published-release.json
          [[ "$(jq -r .draft published-release.json)" == "false" ]]
          [[ "$(jq -r .prerelease published-release.json)" == "false" ]]
